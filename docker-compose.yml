services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lexicon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexicon}
      POSTGRES_DB: ${POSTGRES_DB:-lexicon}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexicon} -d ${POSTGRES_DB:-lexicon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lexicon}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lexicon-dev-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Runtime role — ADR-0002 restricts this to INSERT/SELECT on
      # QUERY_LOG/RETRIEVED_CHUNK/CITATION_VERDICT. Created by migration
      # 0002 (which runs as DATABASE_ADMIN_URL below), so this URL only
      # works after `alembic upgrade head` has completed — see Dockerfile.
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${APP_DB_ROLE:-lexicon_app}:${APP_DB_PASSWORD:-lexicon_app_dev_only}@postgres:5432/lexicon}
      # Migration/admin role — full DDL/DML, including the UPDATE/DELETE on
      # audit tables the runtime role above is deliberately denied.
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:-postgresql+psycopg://${POSTGRES_USER:-lexicon}:${POSTGRES_PASSWORD:-lexicon}@postgres:5432/lexicon}
      APP_DB_ROLE: ${APP_DB_ROLE:-lexicon_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-lexicon_app_dev_only}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # LLM provider (ADR-0001/ADR-0003) — unset in this environment as of
      # Session 4 (docs/project-memory/12-session-handoff.md). Absence is
      # the deliberate signal llm/factory.py uses to select the stub tier,
      # not a boot-time failure.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GENERATION_MODEL: ${GENERATION_MODEL:-claude-sonnet-5}
      VERIFICATION_MODEL: ${VERIFICATION_MODEL:-claude-haiku-4-5}
    ports:
      - "8010:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3001:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
