version: 2
updates:
  # Backend Python dependencies (backend/pyproject.toml)
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  # Retrieval spike requirements.txt
  - package-ecosystem: pip
    directory: "/docs/spikes/session1-hybrid-retrieval"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  # Frontend dependencies (frontend/package.json)
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint (via eslint-config-next) refuses to load on TS 7
      # ("does not support TS 7.0"), so lint fails. Revisit once it supports TS >= 7.1.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-config-next 15/16 peer eslint <= 9, so an ESLint 10 bump fails
      # `npm ci` (ERESOLVE). Move eslint with eslint-config-next once it supports 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # eslint-config-next 16 is flat-config only (eslint.config.mjs must stop using
      # FlatCompat) and enables the react-hooks v7 rules, which flag 4 existing
      # components (set-state-in-effect). Migrate deliberately, not via a bump.
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
  # Backend Dockerfile base image
  - package-ecosystem: docker
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  # Frontend Dockerfile base image
  - package-ecosystem: docker
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  # Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
