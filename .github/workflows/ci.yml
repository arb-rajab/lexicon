name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the GITHUB_TOKEN; jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, type-check, security, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    # pytest needs a real Postgres+pgvector instance — the ADR-0002 grant-
    # assertion test and the NFR-001 recall regression test are both
    # written to be honest against real infrastructure, not a mock
    # (12-session-handoff.md's Session 4 ground rule). Migration 0002
    # creates the restricted app role itself, so only the admin/superuser
    # role needs provisioning here.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lexicon
          POSTGRES_PASSWORD: lexicon
          POSTGRES_DB: lexicon
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lexicon -d lexicon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # T-05's rate-limit/spend-ceiling controls (api/rate_limit.py) are
      # Redis-backed (NFR-007) — tests need a real instance for the same
      # reason the Postgres service above exists (conftest.py's ground
      # rule: no ADR-0002/NFR-001-style test is honest against a mock).
      # Host port matches docker-compose.yml's dev port (6380) so
      # config.py's REDIS_URL default resolves here with no override.
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_ADMIN_URL: postgresql+psycopg://lexicon:lexicon@localhost:5433/lexicon
      DATABASE_URL: postgresql+psycopg://lexicon_app:lexicon_app_dev_only@localhost:5433/lexicon
      APP_DB_ROLE: lexicon_app
      APP_DB_PASSWORD: lexicon_app_dev_only
      REDIS_URL: redis://localhost:6380/0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install '.[dev]'

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy src

      - name: bandit
        run: bandit -r src

      - name: alembic upgrade head
        run: alembic upgrade head

      - name: pytest
        run: pytest -q

      - name: Session 5 evaluation harness (golden dataset, stub-tier methodology proof)
        # Same DB/tier as the pytest step above (test_evaluation_harness.py
        # already gates this via `pytest -q`) — run a second time here,
        # unpiped, so the harness's own stub-tier-vs-real-quality caveat
        # (docs/adr/ADR-0004-real-llm-verification-descoped.md) is always
        # visible in this job's logs, not only on failure.
        run: python -m tests.eval.run_evaluation

      - name: Session 6 adversarial injection corpus (ADR-0003 enforcement + stub-tier self-check)
        # Same pattern as the Session 5 step above: test_adversarial_corpus.py
        # already gates this via `pytest -q`; run it a second time here,
        # unpiped, so both the hard application-layer enforcement invariant
        # and the stub-tier self-check caveat are always visible in this
        # job's logs. See tests/security/run_adversarial_evaluation.py's
        # module docstring for the precise claim/non-claim split.
        run: python -m tests.security.run_adversarial_evaluation

      - name: pip-audit
        run: pip-audit

  frontend:
    name: Frontend (lint, build, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: build
        run: npm run build

      - name: test
        run: npm test

      - name: npm audit
        run: npm audit --omit=dev

  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Gates on the OSV database across the whole frontend lockfile, including dev
  # dependencies, which the `npm audit --omit=dev` step above deliberately skips.
  # Exceptions live, dated, in osv-scanner.toml.
  dependency-scan:
    name: Dependency vulnerability scan (osv-scanner)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --lockfile=frontend/package-lock.json

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      security-events: write
    strategy:
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # CodeQL for this repo's own GitHub Actions workflows (injection via
  # untrusted event data, over-broad token permissions, unsafe checkouts).
  # A separate job so the existing CodeQL job and its required check name
  # stay unchanged; GitHub's required `CodeQL` check gates its alerts too.
  codeql-actions:
    name: CodeQL (actions)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"
