[project]
name = "lexicon-backend"
version = "0.0.1"
description = "lexicon backend — grounded document Q&A API (Session 4: ingestion, hybrid retrieval, generate/verify pipeline)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "pgvector>=0.3",
    "fastembed>=0.4",
    "anthropic>=1.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
    "bandit>=1.7",
    "pip-audit>=2.7",
]
# Session 7 (release readiness): the production ASGI server. Not part of
# `dev` (that's the lint/test toolchain) and not part of the base
# dependency set either — ../Dockerfile's dev image never needs it (bare
# `uvicorn --reload`), only docker/Dockerfile.prod does.
prod = [
    "gunicorn>=23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lexicon"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern requires Depends(...)/Query(...) as
# an argument default — the idiomatic form, not a mutable-default footgun.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.bandit]
exclude_dirs = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
